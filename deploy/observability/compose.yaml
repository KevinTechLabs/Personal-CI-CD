# Observability stack, shared by both environments. Run once on AI-LAB (not
# managed by the GitOps agent):
#
#   sudo deploy/observability/configure-alerts.sh --sentinel http://<ip>:8088   # once
#   cd deploy/observability && docker compose --env-file grafana.env up -d
#
# What watches what:
#
#   prometheus      scrapes everything below, evaluates SLO + alert rules
#   alertmanager    sends every alert (and its resolution) to Sentinel, plus
#                   a heartbeat every minute; if the heartbeat stops, Sentinel
#                   tells you that AI-LAB's monitoring itself went down
#   blackbox        probes app endpoints like a user would, plus the external
#                   services the deploy path depends on (GHCR, GitHub, Sigstore)
#   node-exporter   host disk, memory, CPU, clock skew; also publishes the
#                   GitOps agent's own metrics (textfile collector)
#   grafana         dashboards on :${GRAFANA_PORT:-3000} (set in grafana.env)
#
# Prometheus and Alertmanager listen on localhost only (the GitOps agent uses
# Prometheus for its rollback SLO check). Everything else is internal.

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  networks: [observability]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  alertmanager:
    <<: *hardening
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Written by configure-alerts.sh: Sentinel's URL and its ingest-only
      # key. Never committed (see .gitignore).
      - ./secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  blackbox:
    <<: *hardening
    image: prom/blackbox-exporter:v0.28.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    read_only: true
    cap_drop: [ALL]

  node-exporter:
    <<: *hardening
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
      # Skip container/virtual filesystems so disk alerts reflect real disks.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /var/lib/gitops-agent/metrics:/textfile:ro
    read_only: true
    cap_drop: [ALL]

  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?create grafana.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Open WebUI (NexusLLM) also defaults to 3000; set GRAFANA_PORT in
      # grafana.env if it runs on this host.
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  observability:
    external: true
    name: observability
