# Observability stack: Prometheus + Grafana, shared by both environments.
# Run once on AI-LAB (not managed by the GitOps agent):
#
#   docker network create observability   # if the agent hasn't already
#   cd deploy/observability && docker compose --env-file grafana.env up -d
#
# Prometheus is bound to localhost: the GitOps agent queries it for the
# rollback SLO check. Grafana is on the LAN at http://ai-lab:3000.

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [observability]
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?create grafana.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    networks: [observability]
    security_opt: ["no-new-privileges:true"]

volumes:
  prometheus-data:
  grafana-data:

networks:
  observability:
    external: true
    name: observability
