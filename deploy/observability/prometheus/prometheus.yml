global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    host: ai-lab

rule_files:
  - rules.yml
  - dora.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # --- application metrics ---------------------------------------------------
  - job_name: api
    static_configs:
      - targets: ["api-staging:8000"]
        labels: { env: staging }
      - targets: ["api-production:8000"]
        labels: { env: production }

  - job_name: worker
    static_configs:
      - targets: ["worker-staging:9100"]
        labels: { env: staging }
      - targets: ["worker-production:9100"]
        labels: { env: production }

  # --- synthetic probes: is each environment serving, as a user sees it? ----
  # Probing /ready also refreshes the API's readiness_check_* gauges.
  - job_name: probe-app
    metrics_path: /probe
    params: { module: [http_ready] }
    static_configs:
      - targets: ["http://api-staging:8000/ready"]
        labels: { env: staging }
      - targets: ["http://api-production:8000/ready"]
        labels: { env: production }
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # --- external dependencies of the deploy path -----------------------------
  # If any of these is unreachable from AI-LAB, the GitOps agent cannot pull,
  # fetch desired state, or verify signatures.
  - job_name: probe-deps
    metrics_path: /probe
    params: { module: [http_external] }
    scrape_interval: 60s
    scrape_timeout: 15s
    static_configs:
      - targets: ["https://ghcr.io/v2/"]
        labels: { dependency: container-registry }
      - targets: ["https://github.com/KevinTechLabs/Personal-CI-CD"]
        labels: { dependency: git-desired-state }
      - targets: ["https://rekor.sigstore.dev/api/v1/log"]
        labels: { dependency: sigstore-transparency-log }
      - targets: ["https://tuf-repo-cdn.sigstore.dev/root.json"]
        labels: { dependency: sigstore-trust-root }
    relabel_configs: *blackbox_relabel

  # --- the monitoring stack watching itself ---------------------------------
  - job_name: probe-observability
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ["http://grafana:3000/api/health"]
        labels: { component: grafana }
      - targets: ["http://alertmanager:9093/-/healthy"]
        labels: { component: alertmanager }
    relabel_configs: *blackbox_relabel

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox:9115"]

  # --- host + GitOps agent (textfile collector) -----------------------------
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
