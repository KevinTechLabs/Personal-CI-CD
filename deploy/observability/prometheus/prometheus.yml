global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api-staging:8000"]
        labels: { env: staging }
      - targets: ["api-production:8000"]
        labels: { env: production }

  - job_name: worker
    static_configs:
      - targets: ["worker-staging:9100"]
        labels: { env: staging }
      - targets: ["worker-production:9100"]
        labels: { env: production }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
